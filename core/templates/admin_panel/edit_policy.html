{% extends 'base.html' %}
{% block title %}Edit Policy{% endblock %}
{% block page_title %}Edit Policy{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card"><div class="card-header"><i class="fas fa-edit me-2"></i>Edit: {{ policy.title }}</div>
<div class="card-body p-4">
    <form method="post">{% csrf_token %}
        <div class="row g-3 mb-3">
            <div class="col-md-8"><label class="form-label">Title</label><input type="text" name="title" class="form-control" value="{{ policy.title }}" required></div>
            <div class="col-md-4"><label class="form-label">Version</label><input type="text" name="version" class="form-control" value="{{ policy.version }}"></div>
        </div>
        <div class="mb-3"><label class="form-label">Content</label><textarea name="content" class="form-control" rows="8">{{ policy.content }}</textarea></div>
        <div class="mb-4 form-check form-switch"><input class="form-check-input" type="checkbox" name="is_active" id="ia" {% if policy.is_active %}checked{% endif %}><label class="form-check-label" for="ia">Active</label></div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">Update Policy</button>
            <a href="{% url 'admin_panel:compliance' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div></div>
</div></div>
{% endblock %}

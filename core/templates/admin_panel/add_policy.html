{% extends 'base.html' %}
{% block title %}Add Policy{% endblock %}
{% block page_title %}Add Compliance Policy{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card"><div class="card-header"><i class="fas fa-file-contract me-2"></i>New Policy</div>
<div class="card-body p-4">
    <form method="post">{% csrf_token %}
        <div class="row g-3 mb-3">
            <div class="col-md-8"><label class="form-label">Policy Title *</label><input type="text" name="title" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Version</label><input type="text" name="version" class="form-control" value="1.0"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Policy Type *</label>
            <select name="policy_type" class="form-select" required>
                <option value="privacy">Privacy Policy</option>
                <option value="data_retention">Data Retention Policy</option>
                <option value="consent">User Consent Policy</option>
                <option value="bias">AI Bias Policy</option>
                <option value="accessibility">Accessibility Policy</option>
            </select>
        </div>
        <div class="mb-4"><label class="form-label">Policy Content *</label><textarea name="content" class="form-control" rows="8" required placeholder="Write the full policy text here..."></textarea></div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">Create Policy</button>
            <a href="{% url 'admin_panel:compliance' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div></div>
</div></div>
{% endblock %}

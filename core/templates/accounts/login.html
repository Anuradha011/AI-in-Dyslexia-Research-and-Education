{% extends 'base.html' %}
{% block auth_content %}
<div style="min-height:100vh;background:linear-gradient(135deg,#6c63ff,#fd79a8);display:flex;align-items:center;justify-content:center;padding:20px;">
    <div style="width:100%;max-width:440px;">
        <div class="text-center mb-4">
            <div style="width:64px;height:64px;background:rgba(255,255,255,0.25);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;backdrop-filter:blur(10px);">
                <i class="fas fa-brain fa-2x text-white"></i>
            </div>
            <h3 style="color:#fff;font-weight:800;">Welcome Back</h3>
            <p style="color:rgba(255,255,255,0.7);">Sign in to your DyslexiaCare account</p>
        </div>
        <div class="card p-4">
            {% if messages %}{% for msg in messages %}<div class="alert alert-danger">{{ msg }}</div>{% endfor %}{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted small">No account? </span>
                <a href="{% url 'accounts:register' %}" class="small fw-bold text-decoration-none" style="color:#6c63ff;">Create one</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
